<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#131926"/>
    </linearGradient>
    <!-- Blue/Indigo Gradient for Scrapers -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Green Gradient for DB -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- Purple Gradient for Agents -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <!-- Orange Gradient for Output -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <!-- Shadow Effect -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Markers for Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>
  
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <circle cx="0" cy="0" r="200" fill="#6366f1" fill-opacity="0.02" />
  <circle cx="850" cy="480" r="300" fill="#8b5cf6" fill-opacity="0.02" />
  
  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="1">SƠ ĐỒ KIẾN TRÚC HỆ THỐNG (SYSTEM ARCHITECTURE)</text>
  
  <!-- 1. DATA SOURCES SECTION -->
  <g transform="translate(40, 60)" filter="url(#shadow)">
    <!-- Column Border -->
    <rect width="180" height="380" rx="12" fill="rgba(30, 41, 59, 0.4)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.5">1. DATA SOURCES</text>
    
    <!-- Source 1: YouTube -->
    <g transform="translate(15, 45)">
      <rect width="150" height="65" rx="8" fill="url(#blueGrad)"/>
      <text x="75" y="30" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#ffffff">YouTube RSS</text>
      <text x="75" y="48" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255, 255, 255, 0.8)">Andre Karpathy, TwoMinPapers</text>
    </g>
    
    <!-- Source 2: OpenAI -->
    <g transform="translate(15, 125)">
      <rect width="150" height="65" rx="8" fill="url(#blueGrad)"/>
      <text x="75" y="30" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#ffffff">OpenAI Blog</text>
      <text x="75" y="48" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255, 255, 255, 0.8)">RSS Feed chính thức</text>
    </g>
    
    <!-- Source 3: Anthropic -->
    <g transform="translate(15, 205)">
      <rect width="150" height="65" rx="8" fill="url(#blueGrad)"/>
      <text x="75" y="30" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#ffffff">Anthropic Blog</text>
      <text x="75" y="48" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255, 255, 255, 0.8)">Web Scraping + RSS</text>
    </g>
    
    <!-- Source 4: Hugging Face -->
    <g transform="translate(15, 285)">
      <rect width="150" height="65" rx="8" fill="url(#blueGrad)"/>
      <text x="75" y="30" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#ffffff">Hugging Face</text>
      <text x="75" y="48" text-anchor="middle" font-family="Arial" font-size="10" fill="rgba(255, 255, 255, 0.8)">RSS Feed bài viết mới</text>
    </g>
  </g>
  
  <!-- 2. DATA STORAGE (DATABASE) -->
  <g transform="translate(290, 150)" filter="url(#shadow)">
    <rect width="180" height="200" rx="12" fill="url(#greenGrad)"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">2. CORE DATABASE</text>
    
    <!-- DB Type Indicator -->
    <text x="90" y="55" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#a7f3d0">SQLite / Postgres</text>
    <line x1="20" y1="70" x2="160" y2="70" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <!-- Table 1 -->
    <g transform="translate(15, 85)">
      <rect width="150" height="40" rx="6" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255,255,255,0.1)"/>
      <text x="75" y="24" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#ffffff">Bảng: articles</text>
      <text x="75" y="34" text-anchor="middle" font-family="Arial" font-size="8" fill="#a7f3d0">Lưu thông tin cào thô</text>
    </g>
    
    <!-- Table 2 -->
    <g transform="translate(15, 140)">
      <rect width="150" height="40" rx="6" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255,255,255,0.1)"/>
      <text x="75" y="24" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#ffffff">Bảng: digests</text>
      <text x="75" y="34" text-anchor="middle" font-family="Arial" font-size="8" fill="#a7f3d0">Bản tin tóm tắt &amp; gửi email</text>
    </g>
  </g>
  
  <!-- 3. AI AGENTS (GROQ API) -->
  <g transform="translate(540, 60)" filter="url(#shadow)">
    <rect width="270" height="235" rx="12" fill="url(#purpleGrad)"/>
    <text x="135" y="25" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">3. AI PROCESSING (GROQ API)</text>
    
    <!-- Agent 1: Digest Agent -->
    <g transform="translate(20, 45)">
      <rect width="230" height="50" rx="6" fill="rgba(255, 255, 255, 0.15)"/>
      <text x="15" y="22" font-family="Arial" font-size="12" font-weight="700" fill="#ffffff">Digest Agent (LLaMA-3.1)</text>
      <text x="15" y="38" font-family="Arial" font-size="9" fill="#fbcfe8">Đọc bài viết thô -&gt; Tóm tắt thành JSON</text>
    </g>
    
    <!-- Agent 2: Curator Agent -->
    <g transform="translate(20, 105)">
      <rect width="230" height="50" rx="6" fill="rgba(255, 255, 255, 0.15)"/>
      <text x="15" y="22" font-family="Arial" font-size="12" font-weight="700" fill="#ffffff">Curator Agent (LLaMA-3.1)</text>
      <text x="15" y="38" font-family="Arial" font-size="9" fill="#fbcfe8">Lọc top 10 theo Hồ sơ cá nhân (Profile)</text>
    </g>
    
    <!-- Agent 3: Email Agent -->
    <g transform="translate(20, 165)">
      <rect width="230" height="50" rx="6" fill="rgba(255, 255, 255, 0.15)"/>
      <text x="15" y="22" font-family="Arial" font-size="12" font-weight="700" fill="#ffffff">Email Agent (Gmail SMTP)</text>
      <text x="15" y="38" font-family="Arial" font-size="9" fill="#fbcfe8">Viết email digest &amp; gửi tự động</text>
    </g>
  </g>
  
  <!-- 4. WEB UI & DELIVERABLES -->
  <g transform="translate(540, 315)" filter="url(#shadow)">
    <rect width="270" height="125" rx="12" fill="url(#orangeGrad)"/>
    <text x="135" y="25" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">4. DASHBOARD &amp; GMAIL</text>
    
    <!-- Output 1: FastAPI Dashboard -->
    <g transform="translate(15, 40)">
      <rect width="115" height="65" rx="6" fill="rgba(255,255,255,0.15)"/>
      <text x="57.5" y="28" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#ffffff">FastAPI Web UI</text>
      <text x="57.5" y="42" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffe4e6">Dashboard đọc tin, chỉnh profile, xem logs</text>
    </g>
    
    <!-- Output 2: Gmail Digest -->
    <g transform="translate(140, 40)">
      <rect width="115" height="65" rx="6" fill="rgba(255,255,255,0.15)"/>
      <text x="57.5" y="28" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#ffffff">Gmail Digest</text>
      <text x="57.5" y="42" text-anchor="middle" font-family="Arial" font-size="8" fill="#ffe4e6">Bản tin hàng ngày gửi thẳng hộp thư</text>
    </g>
  </g>
  
  <!-- CONNECTIONS / FLOW ARROWS -->
  <!-- 1. Scrapers to Database -->
  <path d="M 220 250 L 282 250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 2. Database to Agents (Fetch raw data) -->
  <path d="M 380 150 L 380 90 L 532 90" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 3. Agents output to Database (Save digest) -->
  <path d="M 540 180 L 488 180" fill="none" stroke="#a78bfa" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrowPurple)"/>
  
  <!-- 4. Database to Web UI (Serve data) -->
  <path d="M 380 350 L 380 400 L 532 400" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 5. Email Agent to Gmail Output -->
  <path d="M 780 295 L 780 345" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
</svg>
