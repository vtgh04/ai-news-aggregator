services:
  # 1. Cron Job: Chạy pipeline tự động & gửi email lúc 14:00 VN hàng ngày (7:00 UTC)
  - type: cron
    name: daily-digest
    runtime: python
    buildCommand: pip install uv && uv pip install --system -r requirements.txt
    startCommand: python main.py
    schedule: "0 7 * * *"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: news-db
          property: connectionString

  # 2. Web Service: Giao diện FastAPI Web Dashboard
  - type: web
    name: news-dashboard
    runtime: python
    buildCommand: pip install uv && uv pip install --system -r requirements.txt
    startCommand: uvicorn app.web.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: news-db
          property: connectionString

databases:
  - name: news-db
    databaseName: news
    plan: free
