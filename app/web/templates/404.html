<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Không tìm thấy trang</title>
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    .error-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      max-width: 500px;
      width: 100%;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .svg-container {
      width: 220px;
      height: 220px;
      margin-bottom: 0.5rem;
    }
    .error-title {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
    }
    .error-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0 0 0.5rem 0;
    }
    .back-btn {
      background: var(--primary-gradient);
      color: white;
      text-decoration: none;
      padding: 0.75rem 2rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px var(--primary-glow);
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="svg-container">
      <!-- Custom SVG: Stylized floating news page with 404 lens -->
      <svg width="100%" height="100%" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Floating Stars -->
        <circle cx="20" cy="40" r="1.5" fill="#a78bfa" opacity="0.6"/>
        <circle cx="180" cy="60" r="2" fill="#8b5cf6" opacity="0.8"/>
        <circle cx="160" cy="150" r="1" fill="#cbd5e1" opacity="0.5"/>
        <circle cx="35" cy="170" r="2" fill="#6366f1" opacity="0.7"/>
        
        <!-- Newspaper page body -->
        <g filter="drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.45))">
          <rect x="50" y="30" width="100" height="130" rx="8" fill="#131926" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
          <!-- Article Lines (Representing news) -->
          <rect x="65" y="45" width="70" height="8" rx="2" fill="#334155"/>
          <rect x="65" y="60" width="50" height="6" rx="2" fill="#1e293b"/>
          <rect x="65" y="73" width="70" height="4" rx="1" fill="#1e293b"/>
          <rect x="65" y="82" width="60" height="4" rx="1" fill="#1e293b"/>
          <rect x="65" y="91" width="65" height="4" rx="1" fill="#1e293b"/>
          <rect x="65" y="100" width="40" height="4" rx="1" fill="#1e293b"/>
        </g>
        
        <!-- Glowing radar circle -->
        <circle cx="115" cy="115" r="45" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4" opacity="0.5">
          <animateTransform attributeName="transform" type="rotate" from="0 115 115" to="360 115 115" dur="10s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Magnifying glass / Radar pointing to 404 -->
        <g filter="drop-shadow(0px 4px 10px rgba(99, 102, 241, 0.4))">
          <!-- Glass Handle -->
          <line x1="130" y1="130" x2="160" y2="160" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round"/>
          <!-- Glass border -->
          <circle cx="115" cy="115" r="28" fill="#1a2031" stroke="#6366f1" stroke-width="3.5"/>
          <!-- 404 text -->
          <text x="115" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">404</text>
        </g>
      </svg>
    </div>
    
    <h1 class="error-title">Tin tức ngoài vùng phủ sóng</h1>
    <p class="error-desc">Liên kết bạn vừa truy cập không tồn tại hoặc đã được di chuyển. Đừng lo lắng, các bản tin AI chính thức vẫn đang được cập nhật liên tục!</p>
    
    <a href="/" class="back-btn">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>
      Trở lại trang chủ
    </a>
  </div>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
    }
    initTheme();
  </script>
</body>
</html>
