<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News Aggregator — Đăng nhập / Đăng ký</title>
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }
    .auth-container {
      width: 100%;
      max-width: 450px;
      margin: auto;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .auth-logo-text {
      font-size: 1.6rem;
      font-weight: 700;
      background: var(--logo-text-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background-color: var(--tabs-bg);
      padding: 0.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
    }
    .auth-tab-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0.75rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .auth-tab-btn.active {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 10px var(--primary-glow);
    }
    .auth-form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-card);
    }
    .auth-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-align: center;
      color: var(--text-primary);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 1.25rem;
    }
    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-input {
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-glow);
    }
    .auth-btn {
      width: 100%;
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .auth-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
    }
    .auth-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="logo-icon">AI</div>
      <div class="auth-logo-text">AI News Aggregator</div>
    </div>

    <!-- Toggle Tabs -->
    <div class="auth-tabs">
      <button id="btn-tab-login" class="auth-tab-btn active" onclick="switchTab('login')">Đăng nhập</button>
      <button id="btn-tab-register" class="auth-tab-btn" onclick="switchTab('register')">Đăng ký</button>
    </div>

    <!-- Card Container -->
    <div class="auth-form-card">
      
      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <h3 class="auth-title">Chào mừng trở lại!</h3>
        <div class="form-group">
          <label for="login-email" class="form-label">Email</label>
          <input type="email" id="login-email" class="form-input" required placeholder="name@example.com">
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="login-password" class="form-label">Mật khẩu</label>
          <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
        </div>
        <button type="submit" class="auth-btn">Đăng nhập</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" style="display: none;" onsubmit="handleRegister(event)">
        <h3 class="auth-title">Đăng ký tài khoản mới</h3>
        <div class="form-group">
          <label for="reg-name" class="form-label">Tên hiển thị</label>
          <input type="text" id="reg-name" class="form-input" required placeholder="Ví dụ: Huy, Minh Tuấn">
        </div>
        <div class="form-group">
          <label for="reg-email" class="form-label">Email nhận tin</label>
          <input type="email" id="reg-email" class="form-input" required placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label for="reg-password" class="form-label">Mật khẩu</label>
          <input type="password" id="reg-password" class="form-input" required minlength="6" placeholder="Tối thiểu 6 ký tự">
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="reg-profile" class="form-label">Sở thích tin tức & Profile</label>
          <textarea id="reg-profile" class="profile-textarea" style="height: 90px; margin-bottom: 0;" required placeholder="Nhập định hướng quan tâm của bạn..."></textarea>
        </div>
        <button type="submit" class="auth-btn">Đăng ký nhận tin</button>
      </form>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-message" class="toast">
    <span id="toast-icon">✓</span>
    <span id="toast-text">Thông báo thành công!</span>
  </div>

  <script>
    let currentMode = 'login';

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
    }
    initTheme();

    // Helper Toast
    function showToast(text, isError = false) {
      const toast = document.getElementById("toast-message");
      const icon = document.getElementById("toast-icon");
      const content = document.getElementById("toast-text");
      
      content.innerText = text;
      if (isError) {
        toast.classList.add("error");
        icon.innerText = "✕";
      } else {
        toast.classList.remove("error");
        icon.innerText = "✓";
      }
      
      toast.style.display = "flex";
      setTimeout(() => {
        toast.style.display = "none";
      }, 4000);
    }

    function switchTab(mode) {
      if (currentMode === mode) return;
      currentMode = mode;
      
      document.getElementById('btn-tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('btn-tab-register').classList.toggle('active', mode === 'register');
      
      document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
      document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
      
      if (mode === 'register' && !document.getElementById('reg-profile').value) {
        document.getElementById('reg-profile').value = `Tên: [Tên của bạn]
Nghề nghiệp: Sinh viên
Chủ đề quan tâm: LLM, AI agents, Python, career in AI
Không quan tâm: crypto, NFT, tin tức chính trị`;
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        if (res.ok) {
          showToast("Đăng nhập thành công! Đang chuyển hướng...");
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        } else {
          const err = await res.json();
          showToast(err.detail || "Đăng nhập thất bại. Vui lòng kiểm tra lại email/mật khẩu.", true);
        }
      } catch (err) {
        showToast("Lỗi kết nối máy chủ.", true);
      }
    }

    async function handleRegister(event) {
      event.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const profile = document.getElementById('reg-profile').value;
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, profile })
        });
        
        if (res.ok) {
          showToast("Đăng ký tài khoản thành công! Tự động đăng nhập...");
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        } else {
          const err = await res.json();
          showToast(err.detail || "Đăng ký thất bại. Email có thể đã được sử dụng.", true);
        }
      } catch (err) {
        showToast("Lỗi kết nối máy chủ.", true);
      }
    }
  </script>
</body>
</html>
